<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>doanson44 — Developer Tools & Playground</title>
    <meta name="description" content="A Rust-powered developer platform with practical web tools, games, CV, and socket playground features." />
    <meta name="keywords" content="developer tools, web tools, rust, wasm, leptos, playground" />
    <meta name="author" content="doanson44" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <!-- Trunk static assets -->
    <link data-trunk rel="copy-dir" href="public" />

    <!-- Bootstrap 5 CSS -->
    <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet" />

    <!-- Bootstrap Icons -->
    <link href="vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet" />

    <!-- Application CSS -->
    <link data-trunk rel="css" href="styles/app.css" />
    <link data-trunk rel="css" href="styles/tool-layout.css" />
    <link data-trunk rel="css" href="styles/theme-transition.css" />

    <!-- Trunk configuration for Leptos -->
    <link data-trunk rel="rust" data-bin="markdown-studio" data-wasm-opt="0" />

    <!-- Theme Initialization (must run before page render to avoid FOUC) -->
    <script>
        (function() {
            const saved = localStorage.getItem('ms-theme');
            const theme = saved || 'dark';
            document.documentElement.setAttribute('data-bs-theme', theme);
        })();
    </script>
</head>
<body>
    <!-- Mermaid interop + copy + theme toggle -->
    <script>
        window.__mermaid_render_counter = 0;

        window.__mermaid_render = async function(id, code) {
            try {
                let retries = 0;
                while (!window.__mermaid && retries < 50) {
                    await new Promise(r => setTimeout(r, 100));
                    retries++;
                }
                if (!window.__mermaid) throw new Error("Mermaid library failed to load");

                window.__mermaid_render_counter += 1;
                const uniqueId = 'mermaid-svg-' + id + '-' + window.__mermaid_render_counter;
                const { svg } = await window.__mermaid.render(uniqueId, code);
                return JSON.stringify({ ok: true, svg: svg });
            } catch (e) {
                return JSON.stringify({ ok: false, error: e.message || String(e) });
            }
        };

        window.__copy_svg_as_png = async function(svgElementId) {
            try {
                const svgElement = document.getElementById(svgElementId);
                if (!svgElement) throw new Error("SVG element not found");

                const clone = svgElement.cloneNode(true);
                clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
                clone.setAttribute("xmlns:xlink", "http://www.w3.org/1999/xlink");

                const rect = svgElement.getBoundingClientRect();
                clone.setAttribute("width", rect.width);
                clone.setAttribute("height", rect.height);

                const bgColor = (document.documentElement.getAttribute('data-bs-theme') || 'dark') === 'light' ? '#ffffff' : '#161b22';
                clone.style.backgroundColor = bgColor;

                const serializer = new XMLSerializer();
                const svgString = serializer.serializeToString(clone);
                const b64 = btoa(unescape(encodeURIComponent(svgString)));
                const url = 'data:image/svg+xml;base64,' + b64;

                const img = new Image();
                img.crossOrigin = "anonymous";
                await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = url; });

                const canvas = document.createElement("canvas");
                canvas.width = rect.width;
                canvas.height = rect.height;
                const ctx = canvas.getContext("2d");
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, rect.width, rect.height);

                return canvas.toDataURL("image/png");
            } catch (e) {
                return JSON.stringify({ ok: false, error: e.message || String(e) });
            }
        };

        window.__set_theme = function(theme) {
            const root = document.documentElement;
            const oldTheme = root.getAttribute('data-bs-theme') || 'dark';

            if (oldTheme === theme) return;

            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const overlay = document.createElement('div');
            overlay.className = 'theme-transition-overlay';
            overlay.setAttribute('aria-hidden', 'true');

            if (prefersReducedMotion) {
                root.setAttribute('data-bs-theme', theme);
                return;
            }

            document.body.appendChild(overlay);
            root.setAttribute('data-bs-theme', theme);

            requestAnimationFrame(() => {
                overlay.classList.add('theme-transition-overlay--hidden');
            });

            window.setTimeout(() => overlay.remove(), 320);
        };
    </script>

    <script type="module">
        import mermaid from './vendor/mermaid/mermaid.esm.min.mjs';

        mermaid.initialize({
            startOnLoad: false,
            securityLevel: 'strict',
            theme: 'default',
            fontFamily: '"Inter", system-ui, -apple-system, sans-serif'
        });

        window.__mermaid = mermaid;
    </script>
</body>
</html>
