<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Markdown Studio — Live Markdown Editor & Preview</title>
    <meta name="description" content="A Rust-powered, client-side Markdown editor with live preview and Mermaid diagram support. Built with Leptos and WebAssembly." />
    <meta name="keywords" content="markdown, editor, preview, mermaid, rust, wasm, leptos" />
    <meta name="author" content="Markdown Studio" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>" />

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous" />

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet" />

    <!-- Application CSS -->
    <link data-trunk rel="css" href="styles/app.css" />

    <!-- Trunk configuration for Leptos -->
    <link data-trunk rel="rust" data-bin="markdown-studio" data-wasm-opt="0" />
</head>
<body>
    <!-- Mermaid.js Interop -->
    <script>
        window.__mermaid_render_counter = 0;
        
        // Global render function callable from WASM immediately
        window.__mermaid_render = async function(id, code) {
            console.log("Mermaid render called:", id);
            try {
                // Wait for mermaid to be loaded by the module script
                let retries = 0;
                while (!window.__mermaid && retries < 50) {
                    await new Promise(r => setTimeout(r, 100));
                    retries++;
                }
                
                if (!window.__mermaid) {
                    throw new Error("Mermaid library failed to load");
                }

                window.__mermaid_render_counter += 1;
                const uniqueId = 'mermaid-svg-' + id + '-' + window.__mermaid_render_counter;
                
                // Mermaid 11.x render returns { svg, bindFunctions }
                const { svg } = await window.__mermaid.render(uniqueId, code);
                console.log("Mermaid render success");
                return JSON.stringify({ ok: true, svg: svg });
            } catch (e) {
                console.error("Mermaid render error:", e);
                return JSON.stringify({ ok: false, error: e.message || String(e) });
            }
        };

        // Global function to copy an SVG as a PNG image to the clipboard
        window.__copy_svg_as_png = async function(svgElementId) {
            try {
                const svgElement = document.getElementById(svgElementId);
                if (!svgElement) throw new Error("SVG element not found");
                
                const clone = svgElement.cloneNode(true);
                clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
                clone.setAttribute("xmlns:xlink", "http://www.w3.org/1999/xlink");
                
                // Set explicit dimensions and dark background
                const rect = svgElement.getBoundingClientRect();
                clone.setAttribute("width", rect.width);
                clone.setAttribute("height", rect.height);
                clone.style.backgroundColor = "#161b22";
                
                const serializer = new XMLSerializer();
                const svgString = serializer.serializeToString(clone);
                
                // Encode to Base64 Data URI to prevent Tainted Canvas issues
                const b64 = btoa(unescape(encodeURIComponent(svgString)));
                const url = `data:image/svg+xml;base64,${b64}`;
                
                const img = new Image();
                img.crossOrigin = "anonymous"; // Helps prevent tainting in some browsers
                await new Promise((resolve, reject) => {
                    img.onload = resolve;
                    img.onerror = reject;
                    img.src = url;
                });
                
                const canvas = document.createElement("canvas");
                canvas.width = rect.width;
                canvas.height = rect.height;
                const ctx = canvas.getContext("2d");
                
                ctx.fillStyle = '#161b22';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, rect.width, rect.height);
                
                const pngBlob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
                const item = new ClipboardItem({ "image/png": pngBlob });
                await navigator.clipboard.write([item]);
                
                return JSON.stringify({ ok: true });
            } catch (e) {
                console.error("Copy SVG error:", e);
                return JSON.stringify({ ok: false, error: e.message || String(e) });
            }
        };
    </script>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
        mermaid.initialize({
            startOnLoad: false,
            theme: 'dark',
            securityLevel: 'strict',
            logLevel: 'error',
            fontFamily: '"Inter", system-ui, -apple-system, sans-serif',
        });
        // Expose mermaid to global scope for the render function
        window.__mermaid = mermaid;
    </script>
</body>
</html>
