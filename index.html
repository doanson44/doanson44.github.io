<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Markdown Studio — Live Markdown Editor & Preview</title>
    <meta name="description" content="A Rust-powered, client-side Markdown editor with live preview and Mermaid diagram support. Built with Leptos and WebAssembly." />
    <meta name="keywords" content="markdown, editor, preview, mermaid, rust, wasm, leptos" />
    <meta name="author" content="Markdown Studio" />

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YcnS/1NesF1BHMFHr0P2tFiLRqNmFIO0rRFq"
          crossorigin="anonymous" />

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet" />

    <!-- Application CSS -->
    <link data-trunk rel="css" href="styles/app.css" />

    <!-- Rust/WASM application -->
    <link data-trunk rel="rust" data-wasm-opt="z" />
</head>
<body>
    <!-- Mermaid.js - loaded as ESM module -->
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
        mermaid.initialize({
            startOnLoad: false,
            theme: 'dark',
            securityLevel: 'strict',
            logLevel: 'error',
            fontFamily: '"Inter", system-ui, -apple-system, sans-serif',
        });
        // Expose mermaid to global scope for wasm-bindgen interop
        window.__mermaid = mermaid;
        window.__mermaid_render_counter = 0;

        // Global render function callable from WASM
        window.__mermaid_render = async function(id, code) {
            try {
                window.__mermaid_render_counter += 1;
                const uniqueId = 'mermaid-svg-' + id + '-' + window.__mermaid_render_counter;
                const { svg } = await mermaid.render(uniqueId, code);
                return JSON.stringify({ ok: true, svg: svg });
            } catch (e) {
                return JSON.stringify({ ok: false, error: e.message || String(e) });
            }
        };
    </script>
</body>
</html>
