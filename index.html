<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>doanson44 — Developer Tools & Playground</title>
    <meta name="description" content="A Rust-powered developer platform with practical web tools, games, CV, and socket playground features." />
    <meta name="keywords" content="developer tools, web tools, rust, wasm, leptos, playground" />
    <meta name="author" content="doanson44" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous" />

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet" />

    <!-- Application CSS -->
    <link data-trunk rel="css" href="styles/app.css" />
    <link data-trunk rel="css" href="styles/tool-layout.css" />

    <!-- Trunk configuration for Leptos -->
    <link data-trunk rel="rust" data-bin="markdown-studio" data-wasm-opt="0" />

    <!-- Theme Initialization (must run before page render to avoid FOUC) -->
    <script>
        (function() {
            const saved = localStorage.getItem('ms-theme');
            const theme = saved || 'dark';
            document.documentElement.setAttribute('data-bs-theme', theme);
        })();
    </script>
</head>
<body>
    <!-- Mermaid interop + copy + theme toggle -->
    <script>
        window.__mermaid_render_counter = 0;

        window.__mermaid_render = async function(id, code) {
            try {
                let retries = 0;
                while (!window.__mermaid && retries < 50) {
                    await new Promise(r => setTimeout(r, 100));
                    retries++;
                }
                if (!window.__mermaid) throw new Error("Mermaid library failed to load");

                window.__mermaid_render_counter += 1;
                const uniqueId = 'mermaid-svg-' + id + '-' + window.__mermaid_render_counter;
                const { svg } = await window.__mermaid.render(uniqueId, code);
                return JSON.stringify({ ok: true, svg: svg });
            } catch (e) {
                return JSON.stringify({ ok: false, error: e.message || String(e) });
            }
        };

        window.__copy_svg_as_png = async function(svgElementId) {
            try {
                const svgElement = document.getElementById(svgElementId);
                if (!svgElement) throw new Error("SVG element not found");

                const clone = svgElement.cloneNode(true);
                clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
                clone.setAttribute("xmlns:xlink", "http://www.w3.org/1999/xlink");

                const rect = svgElement.getBoundingClientRect();
                clone.setAttribute("width", rect.width);
                clone.setAttribute("height", rect.height);

                const bgColor = (document.documentElement.getAttribute('data-bs-theme') || 'dark') === 'light' ? '#ffffff' : '#161b22';
                clone.style.backgroundColor = bgColor;

                const serializer = new XMLSerializer();
                const svgString = serializer.serializeToString(clone);
                const b64 = btoa(unescape(encodeURIComponent(svgString)));
                const url = 'data:image/svg+xml;base64,' + b64;

                const img = new Image();
                img.crossOrigin = "anonymous";
                await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = url; });

                const canvas = document.createElement("canvas");
                canvas.width = rect.width;
                canvas.height = rect.height;
                const ctx = canvas.getContext("2d");
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, rect.width, rect.height);

                const pngBlob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
                const item = new ClipboardItem({ "image/png": pngBlob });
                await navigator.clipboard.write([item]);
                return JSON.stringify({ ok: true });
            } catch (e) {
                return JSON.stringify({ ok: false, error: e.message || String(e) });
            }
        };

        window.__copy_preview_as_html = async function(elementId) {
            try {
                const source = document.getElementById(elementId);
                if (!source) throw new Error("Preview element not found");

                const clone = source.cloneNode(true);
                clone.querySelectorAll('.copy-btn, button').forEach(function(el) {
                    el.remove();
                });

                clone.querySelectorAll('script, iframe, object, embed').forEach(function(el) {
                    el.remove();
                });

                clone.querySelectorAll('table').forEach(function(table) {
                    table.style.borderCollapse = 'collapse';
                    table.style.width = '100%';
                });

                clone.querySelectorAll('th, td').forEach(function(cell) {
                    cell.style.border = '1px solid #adb5bd';
                    cell.style.padding = '6px 8px';
                    cell.style.verticalAlign = 'top';
                });

                clone.querySelectorAll('pre').forEach(function(pre) {
                    pre.style.whiteSpace = 'pre-wrap';
                    pre.style.fontFamily = 'Consolas, "Courier New", monospace';
                    pre.style.padding = '10px';
                });

                clone.querySelectorAll('blockquote').forEach(function(blockquote) {
                    blockquote.style.borderLeft = '4px solid #adb5bd';
                    blockquote.style.paddingLeft = '12px';
                    blockquote.style.marginLeft = '0';
                });

                const html = '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><!--StartFragment-->'
                    + clone.innerHTML
                    + '<!--EndFragment--></body></html>';
                const plainText = clone.innerText || clone.textContent || '';

                const item = new ClipboardItem({
                    "text/html": new Blob([html], { type: "text/html" }),
                    "text/plain": new Blob([plainText], { type: "text/plain" })
                });
                await navigator.clipboard.write([item]);
                return JSON.stringify({ ok: true });
            } catch (e) {
                return JSON.stringify({ ok: false, error: e.message || String(e) });
            }
        };

        window.__toggle_theme = function() {
            const html = document.documentElement;
            const current = html.getAttribute('data-bs-theme') || 'dark';
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-bs-theme', next);
            localStorage.setItem('ms-theme', next);

            // Update Mermaid theme + re-render all existing diagrams
            if (window.__mermaid) {
                window.__mermaid.initialize({ theme: next === 'light' ? 'default' : 'dark' });
                // Re-render all mermaid diagrams in the DOM
                document.querySelectorAll('[data-mermaid-code]').forEach(function(el) {
                    const code = el.getAttribute('data-mermaid-code');
                    if (code) {
                        const uniqueId = 'mermaid-rerender-' + Math.random().toString(36).slice(2, 8);
                        window.__mermaid.render(uniqueId, code).then(function(result) {
                            var diagram = el.querySelector('.mermaid-diagram');
                            if (diagram) diagram.innerHTML = result.svg;
                        }).catch(function() {});
                    }
                });
            }
            return next;
        };
    </script>

    <!-- Mermaid.js ES module init -->
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
        const theme = (document.documentElement.getAttribute('data-bs-theme') || 'dark') === 'light' ? 'default' : 'dark';
        mermaid.initialize({ startOnLoad: false, theme: theme, securityLevel: 'strict', logLevel: 'error', fontFamily: '"Inter", system-ui, -apple-system, sans-serif' });
        window.__mermaid = mermaid;
    </script>

    <!-- Bootstrap 5 JS (required for navbar toggler, dropdowns, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrY0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
</body>
</html>
