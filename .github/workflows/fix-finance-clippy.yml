name: Fix Finance Clippy

on:
  push:
    branches: [feature/finance-toolkit]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fix clippy warning
        run: sed -i "s/\.split(|c: char| c == ',' || c == '\\\\n' || c == ';')/.split([',', '\\\\n', ';'])/" src/features/tools/finance/page.rs
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/tools/finance/page.rs
          git diff --cached --quiet || git commit -m "fix: satisfy finance clippy lint"
          git push
