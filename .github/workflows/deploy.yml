name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Check compilation
        run: cargo check --target wasm32-unknown-unknown

      - name: Run tests
        run: cargo test

      - name: Run clippy
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: Install Trunk
        run: |
          wget -qO- https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf-
          chmod +x trunk
          sudo mv trunk /usr/local/bin/

      - name: Build release
        run: trunk build --release

      - name: Copy static assets to Pages output
        run: |
          cp public/favicon.svg dist/favicon.svg
          mkdir -p dist/vendor
          cp -R public/vendor/. dist/vendor/

      - name: Verify static assets
        run: |
          test -f dist/favicon.svg
          test -f dist/vendor/bootstrap/bootstrap.min.css
          test -f dist/vendor/bootstrap/bootstrap.bundle.min.js
          test -f dist/vendor/bootstrap-icons/bootstrap-icons.min.css

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
