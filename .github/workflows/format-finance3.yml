name: Format Finance 3

on:
  push:
    branches: [feature/finance-toolkit]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fix and format
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/features/tools/finance/page.rs")
          lines = path.read_text().splitlines()
          lines = ["            .split([',', '\\n', ';'])" if ".split(|c: char|" in line else line for line in lines]
          path.write_text("\n".join(lines) + "\n")
          PY
          cargo fmt
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git diff --cached --quiet || git commit -m "fix: satisfy finance clippy lint"
          git push
