name: Temporary Socket Formatter

on:
  push:
    branches:
      - feature/socket-market-filters

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Socket sources
        run: cargo fmt
      - name: Commit formatting changes
        run: |
          if git diff --quiet -- src/features/socket/page.rs src/features/socket/state.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/socket/page.rs src/features/socket/state.rs
          git commit -m "style(socket): apply rustfmt"
          git push
