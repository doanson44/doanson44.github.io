name: Temporary Socket Formatter

on:
  push:
    branches:
      - feature/socket-market-filters

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Format Rust sources
        run: cargo fmt
      - name: Run clippy diagnostics
        run: |
          cargo clippy --target wasm32-unknown-unknown -- -D warnings > clippy-report.txt 2>&1 || true
      - name: Record formatter result
        run: |
          git status --short > /tmp/fmt-status.txt
          git diff --name-only > /tmp/fmt-files.txt
          {
            echo "Formatted files:"
            cat /tmp/fmt-files.txt
            echo
            echo "Diff summary:"
            git diff --stat
          } > fmt-report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fmt-report.txt clippy-report.txt src/features/socket/page.rs src/features/socket/state.rs
          if ! git diff --cached --quiet; then
            git commit -m "chore(socket): record formatter and clippy diagnostics"
            git push
          fi
