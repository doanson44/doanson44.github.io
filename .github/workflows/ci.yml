name: CI

on:
  push:
    branches:
      - master
      - feature/**
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Rust WASM application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Check compilation
        run: cargo check --target wasm32-unknown-unknown

      - name: Run tests
        run: cargo test

      - name: Run clippy
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: Install Trunk
        run: |
          wget -qO- https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf-
          chmod +x trunk
          sudo mv trunk /usr/local/bin/

      - name: Build release
        run: trunk build --release

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install browser test dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Serve release build
        run: python3 -m http.server 8080 --directory dist > /tmp/markdown-studio-http.log 2>&1 &

      - name: Run Mermaid compatibility tests
        run: npx playwright test tests/mermaid-compatibility.spec.mjs
