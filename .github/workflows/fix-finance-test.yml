name: Fix Finance Test

on:
  push:
    branches: [feature/finance-toolkit]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fix test
        run: sed -i 's/calculate(\&\[-100.0, 110.0\], \&\[\])/calculate(\&[], \&[-100.0, 110.0])/g' src/domain/finance.rs
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/domain/finance.rs
          git diff --cached --quiet || git commit -m "test: fix finance IRR test inputs"
          git push
