name: Format Finance Branch

on:
  push:
    branches: [feature/finance-toolkit]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fix and format
        run: |
          sed -i 's/let move=/let price_move=/g; s/-move)/-price_move)/g; s/+move)/+price_move)/g' src/domain/finance.rs
          cargo fmt
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git diff --cached --quiet || git commit -m "style: format finance toolkit"
          git push
