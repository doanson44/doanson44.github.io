name: Rust tests and checks

on:
  pull_request:
    branches:
      - master
      - fix/crypto-futures-technical-analysis
  push:
    branches:
      - master
      - fix/crypto-futures-technical-analysis
      - feat/market-intelligence-api

permissions:
  contents: read

concurrency:
  group: rust-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, check, and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run native tests
        run: cargo test --all

      - name: Check WebAssembly target
        run: cargo check --target wasm32-unknown-unknown

      - name: Run Clippy
        run: cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings

      - name: Check Market Intelligence Worker
        run: cargo check --manifest-path workers/market-intelligence-api/Cargo.toml --target wasm32-unknown-unknown

      - name: Lint Market Intelligence Worker
        run: cargo clippy --manifest-path workers/market-intelligence-api/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
