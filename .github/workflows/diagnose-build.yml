name: Diagnose WASM Compilation

on:
  push:
    branches:
      - feature/tool-platform-refactor-and-expansion

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Capture compiler output
        run: |
          set +e
          cargo check --target wasm32-unknown-unknown > build-error.txt 2>&1
          status=$?
          printf '\nExit code: %s\n' "$status" >> build-error.txt
          exit 0
      - name: Publish compiler output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-error.txt
          git commit -m "chore: capture WASM compiler diagnostics"
          git push
