name: Market Data API Worker

on:
  pull_request:
    branches:
      - master
    paths:
      - "workers/market-data-api/**"
      - ".github/workflows/market-data-api.yml"
  push:
    branches:
      - master
    paths:
      - "workers/market-data-api/**"
      - ".github/workflows/market-data-api.yml"

permissions:
  contents: read

concurrency:
  group: market-data-api-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/market-data-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run Worker tests
        run: npm test
