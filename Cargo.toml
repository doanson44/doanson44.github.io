[package]
name = "markdown-studio"
version = "0.1.0"
edition = "2021"
description = "A Rust-first, client-side Markdown Preview application with live editing and Mermaid diagram support"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
log = "0.4"
console_log = "1"
uuid = { version = "1", features = ["v4", "js"] }
regex = "1"
sha2 = "0.10"
qrcode = "0.14"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlTextAreaElement",
    "HtmlDivElement",
    "HtmlButtonElement",
    "Node",
    "NodeList",
    "DomTokenList",
    "Window",
    "Selection",
    "CssStyleDeclaration",
    "Clipboard",
    "Navigator",
    "Storage",
    "PointerEvent",
    "DomRect",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
