[build]
# For user site (username.github.io), base path is "/"
# For project sites, change to "/repo-name/"
public_url = "/"
# Output directory
dist = "dist"

[watch]
# Ignore Visual Studio and other IDE metadata folders that update constantly
ignore = [".vs", "node_modules"]

# Build Tailwind before Trunk reads and bundles the HTML/CSS assets.
# Use Node as the cross-platform process launcher; the helper handles npm.cmd on Windows.
[[hooks]]
stage = "pre_build"
command = "node"
command_arguments = ["scripts/trunk-build-css.cjs"]
