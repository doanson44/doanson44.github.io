[package]
name = "market-intelligence-api"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
worker = "0.8.7"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
